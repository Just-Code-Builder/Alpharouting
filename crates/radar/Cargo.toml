[package]
name = "radar"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "radar"
path = "src/main.rs"

[dependencies]
alloy = { version = "0.12", features = ["full"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# Pinned exactly — see workspace root Cargo.toml for why.
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.0"
